[toolchain]
anchor_version = "0.30.1"
solana_version = "1.18.17"

[features]
seeds = false
skip-lint = false

[programs.localnet]
twilight_book = "HBVEPbKCUemrSTwPQegnKHhA9JfuWJ82DDG8r6VfeQ4h"

[programs.devnet]
twilight_book = "HBVEPbKCUemrSTwPQegnKHhA9JfuWJ82DDG8r6VfeQ4h"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/bankrun/**/*.test.ts"

[test]
startup_wait = 5000

[test.validator]
url = "https://api.devnet.solana.com"
