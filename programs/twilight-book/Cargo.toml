[package]
name = "twilight-book"
version = "0.1.0"
description = "Discrete batch-auction protocol for tokenized equities during TradFi off-hours"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "twilight_book"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "=0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"
pyth-sdk-solana = "=0.10.5"
solana-program = "=1.18.17"
block-buffer = "=0.10.4"

