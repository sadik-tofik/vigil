[workspace]
members = ["programs/twilight-book"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
opt-level = 3

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[patch.crates-io]
anchor-syn = { path = "patches/anchor-syn" }
proc-macro2 = { path = "patches/proc-macro2" }

